:root {
  --gold:       #c9a84c;
  --gold-light: #f0d080;
  --gold-dim:   #7a5f2a;
  --black:      #0a0a0a;
  --surface:    #111111;
  --surface2:   #1a1a1a;
  --text:       #e8e0cc;
  --muted:      #6b6050;
}

body {
  background: var(--black);
  color: var(--text);
  font-family: 'Raleway', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 16px 80px;
  overflow-x: hidden;
}

/* ── background grain + radial glow ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.10) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  animation: fadeUp .8s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── avatar ── */
.avatar-wrap {
  position: relative;
  width: 120px; height: 120px;
  margin-bottom: 20px;
  cursor: pointer;
}
.avatar-ring {
  position: absolute; inset: -5px;
  border-radius: 50%;
  background: conic-gradient(var(--gold-light), var(--gold-dim), var(--gold), var(--gold-light));
  animation: spin 6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.avatar-ring::after {
  content: '';
  position: absolute; inset: 3px;
  border-radius: 50%;
  background: var(--black);
}
.avatar-img {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  background: var(--surface2);
}
/* placeholder crown icon when no image */
.avatar-placeholder {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  border-radius: 50%;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px;
  user-select: none;
}
.avatar-edit-hint {
  position: absolute; bottom: 2px; right: 2px;
  z-index: 3;
  width: 28px; height: 28px;
  background: var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  box-shadow: 0 0 0 2px var(--black);
}
#avatarInput { display: none; }

/* ── name & bio ── */
.name {
  font-family: 'Cinzel', serif;
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: .15em;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  margin-bottom: 4px;
}
.handle {
  font-size: .85rem;
  color: var(--gold-dim);
  letter-spacing: .2em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.bio {
  font-size: .875rem;
  color: var(--muted);
  text-align: center;
  max-width: 280px;
  line-height: 1.6;
  margin-bottom: 28px;
}

/* ── divider ── */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  margin-bottom: 28px;
}

/* ── video section ── */
.section-label {
  font-family: 'Cinzel', serif;
  font-size: .65rem;
  letter-spacing: .3em;
  color: var(--gold-dim);
  text-transform: uppercase;
  margin-bottom: 12px;
  align-self: flex-start;
}
.video-container {
  width: 100%;
  aspect-ratio: 9/16;
  max-height: 320px;
  border-radius: 16px;
  overflow: hidden;
  background: var(--surface2);
  border: 1px solid var(--gold-dim);
  position: relative;
  margin-bottom: 28px;
  cursor: pointer;
}
.video-container video {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.video-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  color: var(--gold-dim);
  font-size: .8rem;
  letter-spacing: .1em;
}
.video-placeholder svg { opacity: .5; }
#videoInput { display: none; }

/* ── social links ── */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
}
.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 14px 20px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid #2a2a2a;
  color: var(--text);
  text-decoration: none;
  font-family: 'Raleway', sans-serif;
  font-size: .9rem;
  font-weight: 500;
  letter-spacing: .05em;
  transition: all .25s ease;
  position: relative;
  overflow: hidden;
}
.link-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(201,168,76,0.06), transparent);
  opacity: 0;
  transition: opacity .25s;
}
.link-btn:hover {
  border-color: var(--gold-dim);
  transform: translateX(4px);
  box-shadow: -4px 0 0 var(--gold), 0 4px 20px rgba(201,168,76,0.08);
}
.link-btn:hover::before { opacity: 1; }
.link-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.1rem;
}
.link-text { flex: 1; }
.link-label {
  display: block;
  font-size: .7rem;
  color: var(--muted);
  letter-spacing: .15em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.link-value {
  display: block;
  color: var(--text);
  font-weight: 500;
}
.link-arrow {
  color: var(--gold-dim);
  font-size: 1.1rem;
  transition: transform .2s;
}
.link-btn:hover .link-arrow { transform: translateX(4px); }

/* platform colors */
.ig   { background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
.tg   { background: #2AABEE; }
.gh   { background: #24292e; }

/* ── footer ── */
.footer {
  font-size: .7rem;
  color: var(--muted);
  letter-spacing: .2em;
  text-transform: uppercase;
  margin-top: 8px;
}
.footer span { color: var(--gold-dim); }

/* ── upload button ── */
.upload-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: 'Raleway', sans-serif;
  font-size: .75rem;
  letter-spacing: .1em;
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 28px;
}
.upload-btn:hover { background: rgba(201,168,76,0.1); border-color: var(--gold); }

/* gold ornament */
.ornament {
  font-size: 1.2rem;
  color: var(--gold-dim);
  letter-spacing: .5em;
  margin-bottom: 20px;
  opacity: .6;
}

<script>
  function loadAvatar(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = document.getElementById('avatarImg');
    const ph  = document.getElementById('avatarPlaceholder');
    img.src = url;
    img.style.display = 'block';
    ph.style.display  = 'none';
  }

  function loadVideo(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url  = URL.createObjectURL(file);
    const vid  = document.getElementById('videoEl');
    const ph   = document.getElementById('videoPlaceholder');
    vid.src    = url;
    vid.style.display = 'block';
    ph.style.display  = 'none';
    // remove click handler so video controls work
    document.getElementById('videoBox').onclick = null;
  }
</script>
