  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a84c; --gold-light: #f0d080; --gold-dim: #7a5f2a;
      --black: #0a0a0a; --surface: #111111; --surface2: #1a1a1a;
      --text: #e8e0cc; --muted: #6b6050;
    }
    html, body {
      width: 100%; min-height: 100vh;
      background: var(--black);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.10) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    #stars-canvas {
      position: fixed; top:0; left:0;
      width:100%; height:100%;
      pointer-events: none; z-index: 0;
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column;
      align-items: center;
      animation: fadeUp .8s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

/* avatar */
.avatar-wrap {
  position: relative; width: 120px; height: 120px; margin-bottom: 20px;
}
.avatar-ring {
  position: absolute; inset: -5px; border-radius: 50%;
  background: conic-gradient(var(--gold-light), var(--gold-dim), var(--gold), var(--gold-light));
  animation: spin 6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.avatar-ring::after {
  content: ''; position: absolute; inset: 3px;
  border-radius: 50%; background: var(--black);
}
.avatar-img {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: cover;
}

/* text */
.name {
  font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 900;
  letter-spacing: .15em; text-align: center;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dim));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 4px;
}
.handle { font-size: .85rem; color: var(--gold-dim); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 4px; text-align:center; }
.bio { font-size: .875rem; color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 24px; }
.ornament { font-size: 1.1rem; color: var(--gold-dim); letter-spacing: .5em; margin-bottom: 16px; opacity:.6; }
.divider { width:100%; height:1px; background: linear-gradient(90deg,transparent,var(--gold-dim),transparent); margin-bottom:24px; }

/* section label */
.section-label {
  font-family: 'Cinzel', serif; font-size: .6rem; letter-spacing: .3em;
  color: var(--gold-dim); text-transform: uppercase;
  margin-bottom: 12px; width:100%;
}

/* video */
.video-wrap {
  width: 100%; margin-bottom: 28px;
  border-radius: 16px; overflow: hidden;
  border: 1px solid var(--gold-dim);
  background: var(--surface2);
}
.video-wrap video {
  width: 100%; max-height: 340px;
  object-fit: cover; display: block;
}
.vid-tap-hint {
  text-align: center; font-size: .72rem; color: var(--gold-dim);
  letter-spacing:.1em; padding: 8px 0 4px;
}

/* links */
.links { width:100%; display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }
.link-btn {
  display:flex; align-items:center; gap:14px;
  width:100%; padding:14px 20px; border-radius:12px;
  background:var(--surface); border:1px solid #2a2a2a;
  color:var(--text); text-decoration:none;
  font-family:'Raleway',sans-serif; font-size:.9rem; font-weight:500;
  letter-spacing:.05em; transition:all .25s ease;
  position:relative; overflow:hidden;
}
.link-btn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,rgba(201,168,76,0.07),transparent);
  opacity:0; transition:opacity .25s;
}
.link-btn:hover { border-color:var(--gold-dim); transform:translateX(4px); box-shadow:-4px 0 0 var(--gold); }
.link-btn:hover::before { opacity:1; }
.link-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.link-text { flex:1; }
.link-label { display:block; font-size:.68rem; color:var(--muted); letter-spacing:.15em; text-transform:uppercase; margin-bottom:2px; }
.link-value { display:block; color:var(--text); font-weight:500; }
.link-arrow { color:var(--gold-dim); font-size:1.1rem; transition:transform .2s; }
.link-btn:hover .link-arrow { transform:translateX(4px); }
.ig { background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
.tg { background:#2AABEE; }
.gh { background:#24292e; }

.footer { font-size:.7rem; color:var(--muted); letter-spacing:.2em; text-transform:uppercase; margin-top:8px; text-align:center; }
.footer span { color:var(--gold-dim); }

<script>
// ── Stars ──
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

const stars = Array.from({length:130}, () => ({
  x: Math.random()*window.innerWidth,
  y: Math.random()*window.innerHeight,
  r: Math.random()*1.4+0.3,
  alpha: Math.random(),
  speed: Math.random()*0.35+0.08,
  drift: (Math.random()-0.5)*0.25,
  ts: Math.random()*0.018+0.004,
  td: Math.random()>0.5?1:-1,
  gold: Math.random()>0.55
}));

(function loop(){
  ctx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    s.alpha += s.ts*s.td;
    if(s.alpha>=1){s.alpha=1;s.td=-1;}
    if(s.alpha<=0.08){s.alpha=0.08;s.td=1;}
    s.y-=s.speed; s.x+=s.drift;
    if(s.y<-4){s.y=H+4;s.x=Math.random()*W;}
    if(s.x<-4)s.x=W+4;
    if(s.x>W+4)s.x=-4;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    if(s.gold){ctx.shadowColor='rgba(201,168,76,0.9)';ctx.shadowBlur=5;ctx.fillStyle=`rgba(201,168,76,${s.alpha})`;}
    else{ctx.shadowBlur=0;ctx.fillStyle=`rgba(240,230,200,${s.alpha*0.65})`;}
    ctx.fill();ctx.shadowBlur=0;
  });
  requestAnimationFrame(loop);
})();

// ── Auto-play video on iOS ──
const vid = document.getElementById('vid');
document.addEventListener('touchstart', ()=>{ vid.play(); }, {once:true});
vid.play().catch(()=>{});
</script>
