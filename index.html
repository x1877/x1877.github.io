* { margin:0; padding:0; box-sizing:border-box; }
html, body {

  position:fixed;
  top:0; left:0;

  z-index:0;
}
/* glow */
#glow {
  position:fixed; top:0; left:0;
  width:100%; height:100%;

  pointer-events:none; z-index:0;
}
.card {
  position:relative; z-index:1;
  width:100%; max-width:360px;
  display:flex; flex-direction:column; align-items:center;
  gap:0;
}

/* ─ avatar ─ */
.av-wrap {
width:110px; height:110px;
position:relative; margin-bottom:16px;
flex-shrink:0;
}
.av-ring {
position:absolute; inset:-4px; border-radius:50%;
background:conic-gradient(#f0d080,#7a5f2a,#c9a84c,#f0d080);
animation:spin 7s linear infinite;
}
@keyframes spin { to{ transform:rotate(360deg) } }
.av-ring::after {
content:’’; position:absolute; inset:3px;
border-radius:50%; background:#0a0a0a;
}
.av-wrap img {
position:absolute; inset:0; z-index:2;
width:100%; height:100%;
border-radius:50%; object-fit:cover;
}

/* ─ text ─ */
.name {
font-family:‘Cinzel’,serif; font-size:1.8rem; font-weight:900;
letter-spacing:.12em;
background:linear-gradient(135deg,#f0d080 0%,#c9a84c 50%,#7a5f2a 100%);
-webkit-background-clip:text; -webkit-text-fill-color:transparent;
background-clip:text;
margin-bottom:4px; text-align:center;
}
.handle { font-size:.8rem; color:#7a5f2a; letter-spacing:.18em; text-transform:uppercase; margin-bottom:4px; }
.bio { font-size:.82rem; color:#6b6050; text-align:center; margin-bottom:20px; }
.orn { color:#7a5f2a; letter-spacing:.4em; opacity:.6; margin-bottom:14px; font-size:1rem; }
.div { width:100%; height:1px; background:linear-gradient(90deg,transparent,#7a5f2a,transparent); margin-bottom:20px; }
.sec { font-family:‘Cinzel’,serif; font-size:.58rem; letter-spacing:.25em; color:#7a5f2a; text-transform:uppercase; margin-bottom:10px; width:100%; }

/* ─ video ─ */
.vbox {
width:100%; border-radius:14px; overflow:hidden;
border:1px solid #7a5f2a; background:#111;
margin-bottom:22px;
}
.vbox video { width:100%; max-height:300px; object-fit:cover; display:block; }
.vhint { text-align:center; font-size:.68rem; color:#7a5f2a; padding:6px 0 2px; }

/* ─ links ─ */
.links { width:100%; display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
.lb {
display:flex; align-items:center; gap:12px;
padding:12px 16px; border-radius:10px;
background:#111; border:1px solid #222;
color:#e8e0cc; text-decoration:none;
transition:all .2s;

.lb:hover { border-color:#7a5f2a; transform:translateX(3px); box-shadow:-3px 0 0 #c9a84c; }
.li { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.lt { flex:1; }

.lv { display:block; font-size:.85rem; font-weight:500; }

.footer { font-size:.65rem; color:#6b6050; letter-spacing:.18em; text-transform:uppercase; margin-top:4px; }

<script>
// Stars
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const stars = Array.from({length:100}, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 1.2 + 0.2,
  a: Math.random(),
  sp: Math.random() * 0.3 + 0.08,
  dr: (Math.random() - 0.5) * 0.2,
  ts: Math.random() * 0.015 + 0.004,
  td: Math.random() > 0.5 ? 1 : -1,
  gold: Math.random() > 0.6
}));

(function loop() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars.forEach(s => {
    s.a += s.ts * s.td;
    if (s.a >= 1) { s.a = 1; s.td = -1; }
    if (s.a <= 0.05) { s.a = 0.05; s.td = 1; }
    s.y -= s.sp; s.x += s.dr;
    if (s.y < -4) { s.y = window.innerHeight + 4; s.x = Math.random() * window.innerWidth; }
    if (s.x < -4) s.x = window.innerWidth;
    if (s.x > window.innerWidth + 4) s.x = 0;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    if (s.gold) {
      ctx.shadowColor = 'rgba(201,168,76,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillStyle = `rgba(201,168,76,${s.a})`;
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(230,220,190,${s.a * 0.6})`;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  requestAnimationFrame(loop);
})();

// Video play
const vid = document.getElementById('vid');
vid.play().catch(() => {});
document.addEventListener('touchstart', () => vid.play(), {once: true});
vid.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
</script>

/* FLOATING CODE */

    'npm run deploy','curl -X POST /hack','chmod 777 life.sh',

    'python3 -m universe','// TODO: rule world','const me = "x1877"',
    '> access granted ✓','fork() → exec(dream)',
  ];
  function spawn(){
    const el=document.createElement('div');
    el.className='code-float';
    el.textContent=snippets[Math.floor(Math.random()*snippets.length)];
    el.style.left=(Math.random()*95)+'%';
    el.style.fontSize=(Math.random()*0.3+0.55)+'rem';
    const dur=Math.random()*18+12;
    el.style.animationDuration=dur+'s';
    el.style.animationDelay=(Math.random()*-dur)+'s';
    layer.appendChild(el);
    setTimeout(()=>el.remove(),(dur+1)*1000);
  }
  for(let i=0;i<18;i++) spawn();
  setInterval(spawn,2200);
})();
</script>
